pluginManagement {
    repositories {
        //mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0' // https://plugins.gradle.org/plugin/org.gradle.toolchains.foojay-resolver-convention
}

rootProject.name = 'licenser'

//@formatter:off
dependencyResolutionManagement {
    repositories {
        //mavenLocal()
        mavenCentral()
        maven { url = 'https://maven.moddinglegacy.com' } // Gradle API
    }

    versionCatalogs {
        final gradle = '7.0.2'

        register('libs') {
            version 'gitversion-gradle', '3.0.0-beta.19'

            plugin 'licenser',       'net.minecraftforge.licenser'    version '1.2.0'         // https://plugins.gradle.org/plugin/net.minecraftforge.licenser
            plugin 'gradleutils',    'net.minecraftforge.gradleutils' version '3.0.0-beta.20' // https://plugins.gradle.org/plugin/net.minecraftforge.gradleutils
            plugin 'gitversion',     'net.minecraftforge.gitversion'  version '3.0.0-beta.19' // https://plugins.gradle.org/plugin/net.minecraftforge.gitversion
            plugin 'changelog',      'net.minecraftforge.changelog'   version '3.0.0-beta.19' // https://plugins.gradle.org/plugin/net.minecraftforge.changelog
            plugin 'plugin-publish', 'com.gradle.plugin-publish'      version '1.3.1'         // https://plugins.gradle.org/plugin/com.gradle.plugin-publish

            // Static Analysis
            library 'nulls', 'org.jetbrains', 'annotations' version '26.0.2'

            // Gradle API
            // Original: https://github.com/remal-gradle-api/packages/packages/760197?version=7.0.2
            // Mirror:   https://repos.moddinglegacy.com/#/modding-legacy/name/remal/gradle-api/gradle-api/7.0.2
            version 'gradle', gradle
            library 'gradle', 'name.remal.gradle-api', 'gradle-api'  versionRef 'gradle'
        }

        register('testLibs') {
            // Gradle Test Kit
            // Original: https://github.com/remal-gradle-api/packages/packages/760199?version=7.0.2
            // Mirror:   https://repos.moddinglegacy.com/#/modding-legacy/name/remal/gradle-api/gradle-test-kit/7.0.2
            library 'gradle', 'name.remal.gradle-api', 'gradle-test-kit' version gradle

            // Spock
            version 'spock', '2.3-groovy-3.0'
            library 'spock-core',   'org.spockframework', 'spock-core'   versionRef 'spock'
            library 'spock-junit4', 'org.spockframework', 'spock-junit4' versionRef 'spock'
            bundle  'spock', ['spock-core', 'spock-junit4']

            // JUnit (Dependency artifact managed by JvmTestSuite)
            version 'junit', '4.13.2'
        }
    }
}
//@formatter:on
