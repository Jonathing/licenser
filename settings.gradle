pluginManagement {
    repositories {
        //mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'licenser'

//@formatter:off
dependencyResolutionManagement {
    repositories {
        //mavenLocal()
        mavenCentral()
        maven { url = 'https://maven.moddinglegacy.com' } // Gradle API
    }

    versionCatalogs {
        register('libs') {
            version 'gradle-gitversion', '3.0.0-beta.11'

            plugin 'licenser',       'net.minecraftforge.licenser'    version '1.2.0'                // https://plugins.gradle.org/plugin/net.minecraftforge.licenser
            plugin 'gradleutils',    'net.minecraftforge.gradleutils' version '3.0.0-beta.14'        // https://plugins.gradle.org/plugin/net.minecraftforge.gradleutils
            plugin 'gitversion',     'net.minecraftforge.gitversion'  versionRef 'gradle-gitversion' // https://plugins.gradle.org/plugin/net.minecraftforge.gitversion
            plugin 'changelog',      'net.minecraftforge.changelog'   versionRef 'gradle-gitversion' // https://plugins.gradle.org/plugin/net.minecraftforge.changelog
            plugin 'javadoc-links',  'io.freefair.javadoc-links'      version '8.14'                 // https://plugins.gradle.org/plugin/io.freefair.javadoc-links
            plugin 'plugin-publish', 'com.gradle.plugin-publish'      version '1.3.1'                // https://plugins.gradle.org/plugin/com.gradle.plugin-publish
            plugin 'shadow',         'com.gradleup.shadow'            version '9.0.0-rc3'            // https://plugins.gradle.org/plugin/com.gradleup.shadow

            // Gradle API
            // TODO [ForgeGradle][FG7][Gradle Api] REMOVE once Gradle publish their own API artifacts
            // Original:  https://github.com/remal-gradle-api/packages/packages/760197?version=7.0.2
            // Mirror:    https://repos.moddinglegacy.com/#/modding-legacy/name/remal/gradle-api/gradle-api/7.0.2
            version 'gradle', '7.0.2'
            library 'gradle', 'name.remal.gradle-api', 'gradle-api'  versionRef 'gradle'
            library 'nulls',  'org.jetbrains',         'annotations' version    '26.0.2'
            bundle 'gradle', ['gradle', 'nulls']
        }

        register('testLibs') {
            // Gradle Test Kit
            // TODO [ForgeGradle][FG7][Gradle Api] REMOVE once Gradle publish their own API artifacts
            // Original:  https://github.com/remal-gradle-api/packages/packages/760199?version=7.0.2
            // Mirror:    https://repos.moddinglegacy.com/#/modding-legacy/name/remal/gradle-api/gradle-test-kit/7.0.2
            version 'gradle', '7.0.2'
            library 'gradle', 'name.remal.gradle-api', 'gradle-test-kit' versionRef 'gradle'

            // Testing
            version 'spock', '2.3-groovy-3.0'
            library 'spock-core',   'org.spockframework', 'spock-core'   versionRef 'spock'
            library 'spock-junit4', 'org.spockframework', 'spock-junit4' versionRef 'spock'
            bundle  'spock', ['spock-core', 'spock-junit4']
            version 'junit', '4.13.2'
        }
    }
}
//@formatter:on
